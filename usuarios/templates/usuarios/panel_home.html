{% extends 'base_staff.html' %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">Bienvenido, {{ request.user.username|title }}</h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <form action="{% url 'usuarios:logout' %}" method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-sm btn-outline-danger">
                <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
            </button>
        </form>
    </div>
</div>

<div class="row mt-4">
    <div class="col-md-12">
        <div class="card shadow-sm border-0 bg-white">
            <div class="card-body text-center py-5">
                <i class="fas fa-id-badge fa-3x text-secondary mb-3"></i>
                <h3 class="card-title">Panel de {{ nombre_grupo }}</h3>
                <p class="card-text text-muted">
                    Has ingresado al sistema interno. Utiliza el menú de navegación lateral para gestionar 
                    las tareas de tu área.
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
