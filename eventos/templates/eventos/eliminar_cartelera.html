{% extends 'base_staff.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card shadow border-0">

                <div class="card-body text-center p-5">

                    <i class="fas fa-trash-alt fa-3x text-danger mb-4"></i>

                    <h3 class="fw-bold mb-3">
                        Eliminar cartelera
                    </h3>

                    <p class="text-muted mb-4">
                        ¿Seguro que deseas eliminar la cartelera de
                        <strong>{{ cartelera.get_mes_display }} {{ cartelera.anio }}</strong>?
                    </p>

                    {% if cartelera.imagen %}
                        <img
                            src="{{ cartelera.imagen.url }}"
                            class="img-fluid rounded border mb-4"
                            style="max-height:300px;">
                    {% endif %}

                    <form method="post">

                        {% csrf_token %}

                        <a href="{% url 'eventos:lista_carteleras' %}"
                           class="btn btn-outline-secondary">
                            Cancelar
                        </a>

                        <button class="btn btn-danger">
                            <i class="fas fa-trash-alt me-1"></i>
                            Eliminar
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
